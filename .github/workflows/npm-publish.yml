# Publishes easy-devops to npm. Manual: Actions > Node.js Package > Run workflow.
# The e2e suites are run locally before publishing (npm test); they are not run here
# because several depend on the developer machine (Windows paths, hub_backend checkout).

name: Node.js Package

on: workflow_dispatch

jobs:
  ui-checks:
    name: Dashboard UI checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dashboard UI dependencies
        run: npm --prefix src/dashboard/ui install
      - name: Typecheck the dashboard UI
        run: npm --prefix src/dashboard/ui run typecheck
      - name: Lint the dashboard UI
        run: npm --prefix src/dashboard/ui run lint
      - name: Build the dashboard UI
        run: npm --prefix src/dashboard/ui run build

  publish-npm:
    needs: ui-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      - run: npm ci

      # The package ships the BUILT UI (dist/ui), never its sources.
      - name: Build the dashboard UI
        run: npm run build:ui

      - name: Check what will be published
        run: |
          test -f dist/ui/index.html || { echo "::error::dist/ui/index.html is missing - the UI was not built."; exit 1; }
          npm pack --dry-run --json > pack.json
          node -e "
            const files = require('./pack.json')[0].files.map((f) => f.path);
            const built = files.filter((p) => p.startsWith('dist/ui/'));
            const sources = files.filter((p) => p.startsWith('src/dashboard/ui/'));
            if (!files.includes('dist/ui/index.html')) { console.error('::error::dist/ui/index.html is not in the package.'); process.exit(1); }
            if (sources.length) { console.error('::error::UI sources are in the package: ' + sources.slice(0, 5).join(', ')); process.exit(1); }
            console.log('Package OK: ' + files.length + ' files, ' + built.length + ' of them the built UI, no UI sources.');
          "
          rm pack.json

      # --ignore-scripts skips prepublishOnly (build:ui + npm test): the UI was built
      # above and the tests are run locally before publishing.
      - run: npm publish --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{secrets.npm_token}}