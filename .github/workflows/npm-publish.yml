# This workflow will run tests using node and then publish a package to GitHub Packages when a release is created
# For more information see: https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages

name: Node.js Package

on: workflow_dispatch


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/
      - run: npm install
      - run: npm ci

      # Build the dashboard UI. The package ships the BUILT files (dist/ui),
      # never the UI sources: package.json "files" includes dist/ui/ and
      # excludes src/dashboard/ui/.
      - name: Build the dashboard UI
        run: npm run build:ui

      # Stop here if the build is missing or the UI sources would be published.
      - name: Check what will be published
        run: |
          test -f dist/ui/index.html || { echo "::error::dist/ui/index.html is missing - the UI was not built."; exit 1; }
          npm pack --dry-run --json > pack.json
          node -e "
            const files = require('./pack.json')[0].files.map((f) => f.path);
            const built = files.filter((p) => p.startsWith('dist/ui/'));
            const sources = files.filter((p) => p.startsWith('src/dashboard/ui/'));
            if (!files.includes('dist/ui/index.html')) { console.error('::error::dist/ui/index.html is not in the package.'); process.exit(1); }
            if (sources.length) { console.error('::error::UI sources are in the package: ' + sources.slice(0, 5).join(', ')); process.exit(1); }
            console.log('Package OK: ' + files.length + ' files, ' + built.length + ' of them the built UI, no UI sources.');
          "
          rm pack.json

      # --ignore-scripts: the UI is already built above and the tests already
      # ran in the build job, so prepublishOnly must not do both again.
      - run: npm publish --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{secrets.npm_token}}
