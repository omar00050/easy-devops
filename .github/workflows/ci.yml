# Continuous integration for easy-devops and its dashboard UI.
#
# Job 1 runs the CLI/e2e suite (npm test -> node e2e/run.mjs) on Linux and
# Windows, on Node 20 plus the minimum from package.json "engines" (>=18.0.0).
# Job 2 checks the dashboard UI, which is a separate package in
# src/dashboard/ui with its own dependencies and scripts.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node ${{ matrix.node }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 20]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # package-lock.json is tracked at the repo root, so npm ci is exact.
      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  dashboard-ui:
    name: Dashboard UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/dashboard/ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The UI package-lock.json is gitignored, so npm install, not npm ci.
      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
